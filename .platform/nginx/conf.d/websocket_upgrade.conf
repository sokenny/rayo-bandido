# WebSocket upgrade plumbing for the match server (http context).
#
# Elastic Beanstalk terminates the public connection at nginx and proxies to the Node process
# on 127.0.0.1:8080. nginx does not forward the `Upgrade`/`Connection` headers by default, so
# without this the `/ws` handshake in `server/index.mjs` never completes and the lobby sits on
# "connecting". The map keeps `Connection: close` for ordinary requests and only says
# "upgrade" when the client actually asked for one.
map $http_upgrade $connection_upgrade {
    default     upgrade;
    ''          close;
}
