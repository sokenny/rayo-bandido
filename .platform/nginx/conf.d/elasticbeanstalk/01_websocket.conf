# The `/ws` route, proxied with the upgrade headers a WebSocket needs.
#
# Files in this directory are included inside Elastic Beanstalk's own `server` block, so this
# adds a location alongside the platform's default `/` — an exact-prefix match, which nginx
# prefers over the platform's `location /`, so only the socket takes this path and the game's
# static files keep taking the default one.
#
# `proxy_read_timeout` outlives the client's ping interval (`PING_INTERVAL_MS` in
# `src/net/protocol.ts`); nginx would otherwise close an idle race socket at 60s.
location /ws {
    proxy_pass          http://127.0.0.1:8080;
    proxy_http_version  1.1;

    proxy_set_header    Upgrade     $http_upgrade;
    proxy_set_header    Connection  $connection_upgrade;
    proxy_set_header    Host        $host;
    proxy_set_header    X-Real-IP   $remote_addr;

    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
}
