<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Rayo Bandido</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%2718 2 6 18h8l-2 12 14-18h-8z%27 fill=%27%23fcee0a%27/%3E%3C/svg%3E" />
    <!--
      Loading screen styles are inlined so the screen paints before the game bundle is even
      requested, and they repeat the skin in `src/styles.css` rather than importing it for the
      same reason. The hazard bar is a transform animation: it runs on the compositor and keeps
      moving while the main thread builds the city and compiles shaders.
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; overscroll-behavior: none; }
      #loading-root {
        position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background:
          radial-gradient(90% 70% at 50% 108%, rgba(255, 43, 61, 0.16) 0%, transparent 60%),
          linear-gradient(180deg, #05060a 0%, #07070d 55%, #0a0509 100%);
        color: #dfe8f2;
        font-family: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", "DejaVu Sans Mono", "Courier New", monospace;
        -webkit-font-smoothing: antialiased; user-select: none;
        transition: opacity 300ms linear;
      }
      /* Scanlines, the same ones the menus wear. */
      #loading-root::before { content: ""; position: absolute; inset: 0; pointer-events: none;
        background: repeating-linear-gradient(180deg, rgba(0,0,0,0.38) 0 1px, transparent 1px 3px);
        mix-blend-mode: multiply; }
      #loading-root.is-done { opacity: 0; pointer-events: none; }
      /* Set once the fade has finished. The screen stays in the DOM so a multiplayer session
         can bring it back for the next race, and `display: none` is what stops the bar's
         shimmer animation costing compositor work for the rest of the session. */
      #loading-root.is-gone { display: none; }
      .rb-loading__title { position: relative; margin: 0; font-size: clamp(38px, 7.4vw, 74px);
        font-family: Bahnschrift, "DIN Alternate", Haettenschweiler, "Arial Narrow", Impact, sans-serif;
        font-weight: 700; font-stretch: condensed; line-height: 0.9; letter-spacing: 0.02em;
        color: #fcee0a; text-transform: uppercase; transform: skewX(-7deg);
        filter: drop-shadow(0 0 22px rgba(252, 238, 10, 0.28)); }
      .rb-loading__title span { position: relative; z-index: 2; }
      .rb-loading__title::before, .rb-loading__title::after { content: attr(data-text); position: absolute; inset: 0; mix-blend-mode: screen; }
      .rb-loading__title::before { color: #ff2b3d; transform: translate(-3px, 2px); }
      .rb-loading__title::after { color: #4ff3ff; transform: translate(3px, -2px); }
      .rb-loading__sub { padding: 3px 12px 2px; background: #fcee0a; color: #05060a;
        font-size: 10px; font-weight: 700; letter-spacing: 0.3em; text-indent: 0.3em;
        transform: skewX(-7deg) rotate(-0.6deg); box-shadow: 3px 3px 0 rgba(255, 43, 61, 0.55); }
      .rb-loading__bar { position: relative; width: min(340px, 74vw); height: 8px; margin-top: 14px; overflow: hidden;
        background: #04050a; box-shadow: inset 0 0 0 1px rgba(252, 238, 10, 0.24); }
      .rb-loading__bar-fill { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0);
        background: repeating-linear-gradient(-45deg, #fcee0a 0 6px, #b3a800 6px 12px);
        box-shadow: 0 0 12px rgba(252, 238, 10, 0.5); transition: transform 240ms ease-out; }
      .rb-loading__bar-shimmer { position: absolute; inset: 0; width: 34%;
        background: linear-gradient(90deg, transparent, rgba(255, 43, 61, 0.85), transparent);
        animation: rb-loading-shimmer 1.1s linear infinite; }
      .rb-loading__status { font-size: 10px; font-weight: 700; letter-spacing: 0.24em; color: rgba(252, 238, 10, 0.8);
        text-transform: uppercase; min-height: 14px; font-variant-numeric: tabular-nums; }
      .rb-loading__status::before { content: "> "; opacity: 0.6; }
      @keyframes rb-loading-shimmer { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
      @media (prefers-reduced-motion: reduce) { .rb-loading__bar-shimmer { animation: none; } }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="hud-root"></div>
    <div id="menu-root"></div>
    <div id="debug-root"></div>
    <div id="loading-root" role="status" aria-live="polite">
      <h1 class="rb-loading__title" data-text="RAYO BANDIDO"><span>RAYO BANDIDO</span></h1>
      <div class="rb-loading__sub">DRIFT THROUGH THE CYBERPUNK UNDERGROUND</div>
      <div class="rb-loading__bar"><div class="rb-loading__bar-fill"></div><div class="rb-loading__bar-shimmer"></div></div>
      <div class="rb-loading__status">LOADING</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
