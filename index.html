<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rayo Bandido</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%2718 2 6 18h8l-2 12 14-18h-8z%27 fill=%27%234ff3ff%27/%3E%3C/svg%3E" />
    <!--
      Loading screen styles are inlined so the screen paints before the game bundle is even
      requested. The shimmer is a transform animation: it runs on the compositor and keeps
      moving while the main thread builds the city and compiles shaders.
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #070a14; overflow: hidden; }
      #loading-root {
        position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(120% 90% at 50% 100%, #12083a 0%, #070a14 60%);
        color: #e6f0ff; font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased; user-select: none;
        transition: opacity 400ms ease;
      }
      #loading-root.is-done { opacity: 0; pointer-events: none; }
      .rb-loading__title { font-size: 34px; font-weight: 800; letter-spacing: 0.34em; text-indent: 0.34em; line-height: 1;
        background: linear-gradient(90deg, #4ff3ff, #ff3df0); -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 0 14px rgba(79, 243, 255, 0.35)); }
      .rb-loading__sub { font-size: 11px; letter-spacing: 0.32em; text-indent: 0.32em; color: rgba(230, 240, 255, 0.5); margin-top: -8px; }
      .rb-loading__bar { position: relative; width: min(320px, 70vw); height: 3px; margin-top: 12px; overflow: hidden;
        background: rgba(214, 232, 255, 0.13); border-radius: 2px; }
      .rb-loading__bar-fill { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0);
        background: #4ff3ff; box-shadow: 0 0 10px #4ff3ff; transition: transform 240ms ease-out; }
      .rb-loading__bar-shimmer { position: absolute; inset: 0; width: 40%;
        background: linear-gradient(90deg, transparent, rgba(255, 61, 240, 0.9), transparent);
        animation: rb-loading-shimmer 1.1s linear infinite; }
      .rb-loading__status { font-size: 11px; letter-spacing: 0.22em; text-indent: 0.22em; color: rgba(230, 240, 255, 0.62);
        min-height: 14px; font-variant-numeric: tabular-nums; }
      @keyframes rb-loading-shimmer { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .rb-loading__bar-shimmer { animation: none; } }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="hud-root"></div>
    <div id="debug-root"></div>
    <div id="loading-root" role="status" aria-live="polite">
      <div class="rb-loading__title">RAYO BANDIDO</div>
      <div class="rb-loading__sub">JDM × CYBERPUNK</div>
      <div class="rb-loading__bar"><div class="rb-loading__bar-fill"></div><div class="rb-loading__bar-shimmer"></div></div>
      <div class="rb-loading__status">LOADING</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
